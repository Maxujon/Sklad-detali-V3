<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1923">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Склад дверей</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1923;--card:#1a2535;--card2:#212f42;--accent:#3b82f6;
  --border:#2a3a52;--text:#e8edf2;--muted:#7a90a8;
  --ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--purple:#a78bfa;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;padding-bottom:66px;}
a{color:var(--accent);}
button{touch-action:manipulation;cursor:pointer;border:none;outline:none;font-family:inherit;}
input,select,textarea{font-family:inherit;outline:none;}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--card2);border-bottom:1px solid var(--border);padding:10px 14px 8px;}
.header-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.header-title{font-size:17px;font-weight:700;flex:1;}
.badge-offline{background:var(--danger);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;display:none;}
.badge-offline.show{display:inline-block;}
.sync-line{font-size:11px;color:var(--muted);}
.header-actions{display:flex;gap:6px;}
.icon-btn{background:rgba(255,255,255,.08);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;touch-action:manipulation;cursor:pointer;border:none;color:var(--text);}
.icon-btn .red-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--danger);border-radius:50%;display:none;}
.icon-btn .red-dot.show{display:block;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.stat{background:var(--card);border-radius:8px;padding:6px 6px 5px;text-align:center;}
.stat-val{font-size:18px;font-weight:700;line-height:1.1;}
.stat-lbl{font-size:9px;color:var(--muted);margin-top:1px;}
.stat-red .stat-val{color:var(--danger);}
.stat-green .stat-val{color:var(--ok);}
.stat-orange .stat-val{color:var(--warn);}

/* TABS */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card2);border-top:1px solid var(--border);display:flex;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px 8px;touch-action:manipulation;cursor:pointer;border:none;background:none;color:var(--muted);font-size:9px;gap:3px;position:relative;}
.tab.active{color:var(--accent);}
.tab-ico{font-size:18px;line-height:1;}
.tab-badge{position:absolute;top:4px;right:calc(50% - 14px);background:var(--danger);color:#fff;font-size:9px;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;display:none;}
.tab-badge.show{display:flex;}
.tab-badge.orange{background:var(--warn);}

/* PANELS */
.panel{display:none;padding:10px 12px;}
.panel.active{display:block;}

/* SEARCH */
.search-wrap{margin-bottom:8px;}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;}
.search-input::placeholder{color:var(--muted);}

/* CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);touch-action:manipulation;cursor:pointer;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* COLOR FILTER DROPDOWN */
.clr-filter{position:relative;margin-bottom:8px;}
.clr-trigger{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;touch-action:manipulation;}
.clr-trigger-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
.clr-trigger-name{flex:1;font-size:13px;color:var(--text);}
.clr-trigger-arrow{color:var(--muted);font-size:12px;}
.clr-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card2);border:1px solid var(--border);border-radius:10px;max-height:260px;overflow-y:auto;z-index:50;display:none;}
.clr-dropdown.open{display:block;}
.clr-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;touch-action:manipulation;}
.clr-item:hover{background:rgba(255,255,255,.05);}
.clr-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
.clr-name{flex:1;font-size:13px;}
.clr-check{color:var(--ok);font-size:14px;}

/* SECTION HEADER */
.sec-hdr{font-size:11px;font-weight:700;padding:6px 0 4px;letter-spacing:.5px;}
.sec-hdr.danger{color:var(--danger);}
.sec-hdr.ok{color:var(--ok);}

/* STOCK CARD */
.item-card{background:var(--card);border-radius:12px;padding:10px 10px 8px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;}
.item-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;touch-action:manipulation;cursor:pointer;}
.item-body{flex:1;min-width:0;}
.item-name{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:3px;cursor:pointer;touch-action:manipulation;}
.item-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.meta-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.item-qty{font-size:20px;font-weight:700;line-height:1;}
.item-qty.danger{color:var(--danger);}
.item-unit{font-size:10px;color:var(--muted);}
.item-btns{display:flex;gap:4px;}
.qty-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;touch-action:manipulation;cursor:pointer;}
.qty-btn.plus{background:rgba(34,197,94,.15);color:var(--ok);}
.qty-btn.minus{background:rgba(239,68,68,.15);color:var(--danger);}

/* MAP */
.rack-block{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.rack-hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;touch-action:manipulation;}
.rack-badge{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.rack-info{flex:1;}
.rack-desc{font-size:13px;font-weight:600;}
.rack-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.rack-toggle{color:var(--muted);font-size:12px;}
.rack-body{display:none;padding:8px 10px 10px;border-top:1px solid var(--border);}
.rack-body.open{display:block;}
.trow{height:22px;display:flex;flex-direction:row;align-items:center;}
.tlbl{width:26px;min-width:26px;font-size:9px;color:var(--muted);flex-shrink:0;display:flex;align-items:center;}
.cscroll{display:flex;gap:2px;overflow-x:auto;height:22px;scrollbar-width:none;}
.cscroll::-webkit-scrollbar{display:none;}
.slbls{margin-left:26px;display:flex;gap:2px;overflow-x:auto;margin-bottom:1px;scrollbar-width:none;}
.slbls::-webkit-scrollbar{display:none;}
.slb{display:inline-flex;width:22px;min-width:22px;max-width:22px;height:13px;font-size:7px;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
.cell{display:inline-flex;align-items:center;justify-content:center;width:22px;min-width:22px;max-width:22px;height:18px;min-height:18px;max-height:18px;border-radius:2px;border:1px solid rgba(255,255,255,.18);font-size:7px;cursor:pointer;flex-shrink:0;box-sizing:border-box;overflow:hidden;background:rgba(255,255,255,.04);touch-action:manipulation;}
.cell.occ{background:rgba(59,130,246,.35);border-color:var(--accent);}
.cell.crit{background:rgba(239,68,68,.35);border-color:var(--danger);}
.cell.found{background:rgba(245,158,11,.45);border-color:var(--warn);}
.cell.ground{background:rgba(34,197,94,.18);border-color:var(--ok);}
.map-legend{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);}
.legend-box{width:12px;height:12px;border-radius:2px;border:1px solid rgba(255,255,255,.18);}
.legend-box.occ{background:rgba(59,130,246,.35);border-color:var(--accent);}
.legend-box.crit{background:rgba(239,68,68,.35);border-color:var(--danger);}
.legend-box.found{background:rgba(245,158,11,.45);border-color:var(--warn);}
.legend-box.ground{background:rgba(34,197,94,.18);border-color:var(--ok);}

/* HISTORY */
.hist-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-bar{width:3px;border-radius:2px;align-self:stretch;min-height:40px;flex-shrink:0;}
.hist-bar.in{background:var(--ok);}
.hist-bar.out{background:var(--danger);}
.hist-bar.move{background:var(--purple);}
.hist-body{flex:1;min-width:0;}
.hist-type{font-size:12px;font-weight:600;margin-bottom:2px;}
.hist-meta{font-size:11px;color:var(--muted);}
.hist-right{text-align:right;flex-shrink:0;}
.hist-time{font-size:12px;font-weight:600;}
.hist-date{font-size:10px;color:var(--muted);}

/* ORDERS */
.order-card{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.order-hdr{padding:12px 12px 10px;cursor:pointer;touch-action:manipulation;}
.order-title{font-size:14px;font-weight:700;}
.order-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.order-badges{display:flex;gap:6px;margin-top:6px;align-items:center;}
.status-badge{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;}
.status-new{background:rgba(245,158,11,.2);color:var(--warn);}
.status-partial{background:rgba(167,139,250,.2);color:var(--purple);}
.status-done{background:rgba(34,197,94,.2);color:var(--ok);}
.order-body{display:none;border-top:1px solid var(--border);padding:10px 12px 12px;}
.order-body.open{display:block;}
.order-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.order-item:last-child{border-bottom:none;}
.order-cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);background:var(--card2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;margin-top:1px;}
.order-cb.checked{background:var(--ok);border-color:var(--ok);}
.order-item-body{flex:1;min-width:0;}
.order-item-name{font-size:12px;font-weight:600;line-height:1.3;}
.order-item-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.loc-tag{color:var(--accent);font-weight:700;}
.order-qty{font-size:14px;font-weight:700;flex-shrink:0;}
.order-btns{display:flex;gap:8px;margin-top:10px;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;gap:6px;justify-content:center;}
.btn-danger{background:var(--danger);color:#fff;flex:1;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ok{background:var(--ok);color:#fff;flex:1;}
.btn-muted{background:var(--card2);color:var(--text);}
.btn-sm{padding:7px 12px;font-size:12px;}
.btn-full{width:100%;}
.fab{position:fixed;bottom:76px;right:14px;width:48px;height:48px;border-radius:24px;background:var(--accent);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(59,130,246,.4);touch-action:manipulation;cursor:pointer;border:none;z-index:90;}

/* ALERTS */
.alert-card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.alert-icon{font-size:18px;flex-shrink:0;}
.alert-body{flex:1;min-width:0;}
.alert-name{font-size:13px;font-weight:600;}
.alert-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.alert-right{text-align:right;flex-shrink:0;}
.alert-qty{font-size:20px;font-weight:700;color:var(--danger);}
.alert-min{font-size:10px;color:var(--muted);}

/* MODALS (bottom sheet) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 42px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.modal-item-name{font-size:14px;font-weight:700;padding:10px 12px;background:var(--card2);border-radius:10px;margin-bottom:12px;}
.modal-item-code{font-size:11px;color:var(--muted);margin-top:2px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;}
.field select option{background:var(--card2);}
.modal-btns{display:flex;gap:8px;margin-top:16px;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;touch-action:manipulation;}

/* CELL POPUP */
.cell-popup{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px;}
.cell-popup-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.cell-popup-addr{font-size:12px;color:var(--accent);margin-bottom:10px;}
.cell-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.cell-stat{background:var(--card);border-radius:8px;padding:8px;}
.cell-stat-lbl{font-size:10px;color:var(--muted);margin-bottom:2px;}
.cell-stat-val{font-size:15px;font-weight:700;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:300;pointer-events:none;white-space:nowrap;}
.toast.ok{border-color:var(--ok);color:var(--ok);}
.toast.err{border-color:var(--danger);color:var(--danger);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* SETTINGS MODAL */
.settings-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.conn-result{font-size:12px;margin-top:6px;}
.conn-result.ok{color:var(--ok);}
.conn-result.err{color:var(--danger);}

/* NEW ORDER positions */
.order-pos{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;position:relative;}
.order-pos-rm{position:absolute;top:8px;right:8px;background:rgba(239,68,68,.2);border:none;color:var(--danger);width:22px;height:22px;border-radius:5px;font-size:14px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

/* EMPTY STATE */
.empty{text-align:center;color:var(--muted);padding:32px 0;font-size:13px;}
.empty-ico{font-size:36px;margin-bottom:8px;}

/* OP CARD */
.op-card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.op-body{flex:1;min-width:0;}
.op-name{font-size:13px;font-weight:600;}
.op-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.op-btns{display:flex;gap:6px;}
.op-btn{border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;touch-action:manipulation;border:none;}
.op-btn-in{background:rgba(34,197,94,.15);color:var(--ok);}
.op-btn-out{background:rgba(239,68,68,.15);color:var(--danger);}

/* MOVE MODAL */
.move-current{font-size:12px;color:var(--muted);margin-bottom:12px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="header-title">Склад дверей <span id="badgeOffline" class="badge-offline">офлайн</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()" title="Настройки">⚙</button>
      <button class="icon-btn" onclick="switchTab('tabAlerts',this)" title="Тревоги и заказы">
        🔔<span id="dotBell" class="red-dot"></span>
      </button>
    </div>
  </div>
  <div class="sync-line" id="syncLine">Синхронизирую…</div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">Позиций</div></div>
    <div class="stat stat-red"><div class="stat-val" id="statCrit">—</div><div class="stat-lbl">Критичных</div></div>
    <div class="stat stat-green"><div class="stat-val" id="statOps">—</div><div class="stat-lbl">Операций</div></div>
    <div class="stat stat-orange"><div class="stat-val" id="statZero">—</div><div class="stat-lbl">Нет в наличии</div></div>
  </div>
</div>

<!-- PANELS -->
<!-- ОСТАТКИ -->
<div id="tabStock" class="panel active">
  <div class="search-wrap">
    <input class="search-input" id="stockSearch" placeholder="🔍 Поиск по артикулу, названию, цвету, ячейке…" oninput="renderStock()">
  </div>
  <div class="chips" id="catChips"></div>
  <div class="clr-filter">
    <div class="clr-trigger" id="clrTrigger" onclick="toggleClrDrop()">
      <div class="clr-trigger-dot" id="clrTrigDot" style="background:#888"></div>
      <div class="clr-trigger-name" id="clrTrigName">Все цвета</div>
      <div class="clr-trigger-arrow">▾</div>
    </div>
    <div class="clr-dropdown" id="clrDropdown"></div>
  </div>
  <div id="stockList"></div>
</div>

<!-- КАРТА -->
<div id="tabMap" class="panel">
  <div class="search-wrap">
    <input class="search-input" id="mapSearch" placeholder="🔍 Найти деталь на карте…" oninput="searchOnMap()">
  </div>
  <div id="mapContent"></div>
</div>

<!-- ОПЕРАЦИЯ -->
<div id="tabOps" class="panel">
  <div class="search-wrap">
    <input class="search-input" id="opsSearch" placeholder="🔍 Поиск деталей…" oninput="renderOps()">
  </div>
  <div class="chips" id="opsCatChips"></div>
  <div id="opsList"></div>
</div>

<!-- ИСТОРИЯ -->
<div id="tabHist" class="panel">
  <div class="sec-hdr" style="color:var(--text);font-size:13px;margin-bottom:8px;">ИСТОРИЯ ОПЕРАЦИЙ</div>
  <div id="histList"></div>
</div>

<!-- ЗАКАЗЫ -->
<div id="tabOrders" class="panel">
  <div id="ordersList"></div>
  <button class="fab" onclick="openNewOrder()">+</button>
</div>

<!-- ТРЕВОГИ -->
<div id="tabAlerts" class="panel">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
    <div style="font-size:13px;font-weight:700;flex:1;">КРИТИЧНЫЙ ЗАПАС</div>
    <button class="btn btn-accent btn-sm" onclick="exportAlerts()">📋 В таблицу</button>
  </div>
  <div id="alertsList"></div>
</div>

<!-- TABS -->
<nav class="tabs">
  <button class="tab active" id="btnStock" onclick="switchTab('tabStock',this)">
    <span class="tab-ico">🗄</span><span>Остатки</span>
  </button>
  <button class="tab" id="btnMap" onclick="switchTab('tabMap',this)">
    <span class="tab-ico">🗺</span><span>Карта</span>
  </button>
  <button class="tab" id="btnOps" onclick="switchTab('tabOps',this)">
    <span class="tab-ico">⊕</span><span>Операция</span>
  </button>
  <button class="tab" id="btnHist" onclick="switchTab('tabHist',this)">
    <span class="tab-ico">🕐</span><span>История</span>
  </button>
  <button class="tab" id="btnOrders" onclick="switchTab('tabOrders',this)">
    <span class="tab-ico">📋</span><span>Заказы</span>
    <span class="tab-badge orange" id="badgeOrders"></span>
  </button>
  <button class="tab" id="btnAlerts" onclick="switchTab('tabAlerts',this)">
    <span class="tab-ico">🔔</span><span>Тревоги</span>
    <span class="tab-badge" id="badgeAlerts"></span>
  </button>
</nav>

<script>
var SCRIPT_URL = localStorage.getItem('scriptUrl') || '';
var parts=[], stock=[], hist=[], rack=[], clrs=[], orders=[];
var opCount=0, activeCat=null, activeClr=null, mapHL=null;
var currentOpType='in', currentOpCode='', currentOpName='';
var currentCellLoc='', currentCellData=null;
var opsCatFilter=null;
var newOrderPositions=[];
var currentDispatchOrderId=null;

// ========== HELPERS ==========
function sN(n){ if(!n) return '—'; return n.replace(/^[\w.\u0410-\u042F\u0401]+\s+/,'')||n; }
function cH(name){ return (clrs.find(function(c){return c.name===name;})||{}).hex || '#888'; }
function pad(n){ return n<10?'0'+n:''+n; }
function fD(d){ return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function fT(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function catIco(cat){
  if(!cat) return '○';
  if(cat.includes('СТОЕВАЯ')) return '▮';
  if(cat.includes('ВЕРТИКАЛЬНАЯ')) return '⊢';
  if(cat.includes('ГОРИЗОНТАЛЬНАЯ')) return '⊤';
  if(cat.includes('ПЕРЕМЫЧКА')) return '⊣';
  if(cat.includes('ФИЛЕНКА')) return '▣';
  return '○';
}
function catColor(cat){
  if(!cat) return '#888';
  if(cat.includes('СТОЕВАЯ')) return '#3b82f6';
  if(cat.includes('ПЕРЕМЫЧКА')) return '#a78bfa';
  if(cat.includes('ФИЛЕНКА')) return '#f59e0b';
  return '#6b7280';
}
function getMerged(){
  var result = [];
  for(var i=0;i<stock.length;i++){
    var s = stock[i];
    var p = parts.find(function(x){return String(x.code)===String(s.code);}) || {};
    result.push({
      code: s.code,
      name: s.name || p.name || '',
      category: p.category || '',
      color: s.color || '',
      qty: Number(s.qty)||0,
      location: s.location || '',
      min_qty: Number(p.min_qty)||0,
      unit: p.unit || 'шт.'
    });
  }
  return result;
}
function cleanDate(s){
  if(!s) return '';
  var str = String(s);
  if(str.includes('1899')||str.includes('1900')) return '';
  if(str.includes('GMT')&&str.length>15) return '';
  return str;
}
function toast(msg, type){
  var el = document.getElementById('toastEl');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2800);
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function overlayClose(e, id){
  if(e.target === document.getElementById(id)) closeModal(id);
}
function switchTab(id, el){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  var tabMap = {tabStock:'btnStock',tabMap:'btnMap',tabOps:'btnOps',tabHist:'btnHist',tabOrders:'btnOrders',tabAlerts:'btnAlerts'};
  if(tabMap[id]) document.getElementById(tabMap[id]).classList.add('active');
  var fabEl = document.querySelector('.fab');
  if(fabEl) fabEl.style.display = (id==='tabOrders') ? 'flex' : 'none';
  if(id==='tabMap') renderMap();
  if(id==='tabOrders') renderOrders();
  if(id==='tabAlerts') renderAlerts();
  if(id==='tabHist') renderHist();
  if(id==='tabOps') renderOps();
}

// ========== DATA ==========
function defRack(){ return [
  {row:'A',sections:15,tiers:4,length:'870 мм',load:'650 кг',description:'Ряд 1 A'},
  {row:'B',sections:12,tiers:4,length:'870 мм',load:'650 кг',description:'Ряд 1 B'},
  {row:'C',sections:22,tiers:5,length:'1400 мм',load:'1000 кг',description:'Ряд 2 C — стоевая'},
  {row:'D',sections:17,tiers:7,length:'870 мм',load:'650 кг',description:'Ряд 3 D — основной'},
  {row:'E',sections:17,tiers:7,length:'870 мм',load:'650 кг',description:'Ряд 3 E — основной'},
  {row:'F',sections:18,tiers:6,length:'870 мм',load:'650 кг',description:'Ряд 4 F'},
]; }
function defClrs(){ return [
  {name:'Белый',hex:'#F8F8F8'},{name:'Венге',hex:'#3D2B1F'},
  {name:'Орех',hex:'#8B5E3C'},{name:'Антрацит',hex:'#4A4A55'},
  {name:'Дуб сонома',hex:'#C9A96E'},{name:'Капучино',hex:'#D4B896'},
  {name:'Беленый дуб',hex:'#E8D5AA'},{name:'Серый',hex:'#9CA3AF'},
]; }

function saveL(){
  try{
    localStorage.setItem('w_parts', JSON.stringify(parts));
    localStorage.setItem('w_stock', JSON.stringify(stock));
    localStorage.setItem('w_hist',  JSON.stringify(hist.slice(0,200)));
    localStorage.setItem('w_rack',  JSON.stringify(rack));
    localStorage.setItem('w_clrs',  JSON.stringify(clrs));
    localStorage.setItem('w_orders',JSON.stringify(orders));
    localStorage.setItem('lastSync', fT(new Date()));
  }catch(e){}
}
function loadL(){
  try{
    var p = localStorage.getItem('w_parts'); if(p) parts = JSON.parse(p);
    var s = localStorage.getItem('w_stock'); if(s) stock = JSON.parse(s);
    var h = localStorage.getItem('w_hist');  if(h) hist  = JSON.parse(h);
    var r = localStorage.getItem('w_rack');  if(r) rack  = JSON.parse(r); else rack = defRack();
    var c = localStorage.getItem('w_clrs');  if(c) clrs  = JSON.parse(c); else clrs = defClrs();
    var o = localStorage.getItem('w_orders');if(o) orders= JSON.parse(o);
  }catch(e){ rack=defRack(); clrs=defClrs(); }
  var ls = localStorage.getItem('lastSync');
  if(ls) document.getElementById('syncLine').textContent = 'Синхронизировано · '+ls+' (авто)';
}

async function api(action, body){
  var url = SCRIPT_URL + '?action=' + action;
  if(body) url += '&payload=' + encodeURIComponent(JSON.stringify(body));
  var r = await fetch(url, {method:'GET', redirect:'follow'});
  return r.json();
}

async function syncAll(){
  if(!SCRIPT_URL){ loadL(); rebuildAll(); return; }
  try{
    document.getElementById('syncLine').textContent = 'Синхронизирую…';
    var d = await api('getAll');
    if(d.ok){
      if(d.parts && d.parts.length)   parts  = d.parts;
      if(d.stock && d.stock.length)   stock  = d.stock;
      if(d.history && d.history.length) hist = d.history;
      if(d.map && d.map.length)       rack   = d.map;
      if(d.colors && d.colors.length) clrs   = d.colors;
      if(d.orders)                    orders = d.orders;
      opCount = hist.length;
      saveL();
      document.getElementById('badgeOffline').classList.remove('show');
    }
  }catch(e){
    document.getElementById('badgeOffline').classList.add('show');
  }
  rebuildAll();
}

async function silentSync(){
  var anyOpen = document.querySelector('.overlay.show');
  if(anyOpen) return;
  if(!SCRIPT_URL) return;
  try{
    var d = await api('getAll');
    if(d.ok){
      if(d.parts && d.parts.length)   parts  = d.parts;
      if(d.stock && d.stock.length)   stock  = d.stock;
      if(d.history && d.history.length){ hist = d.history; opCount = hist.length; }
      if(d.map && d.map.length)       rack   = d.map;
      if(d.colors && d.colors.length) clrs   = d.colors;
      if(d.orders)                    orders = d.orders;
      saveL();
      var t = fT(new Date());
      document.getElementById('syncLine').textContent = 'Синхронизировано · '+t+' (авто)';
      document.getElementById('badgeOffline').classList.remove('show');
      var activeTab = document.querySelector('.panel.active');
      if(activeTab && activeTab.id === 'tabMap'){
        updateMapCells();
      } else {
        updateStats();
        if(activeTab){
          if(activeTab.id==='tabStock')  renderStock();
          if(activeTab.id==='tabOps')    renderOps();
          if(activeTab.id==='tabHist')   renderHist();
          if(activeTab.id==='tabAlerts') renderAlerts();
          if(activeTab.id==='tabOrders') renderOrders();
        }
      }
    }
  }catch(e){
    document.getElementById('badgeOffline').classList.add('show');
  }
}

function rebuildAll(){
  updateStats();
  buildCatChips();
  buildOpsCatChips();
  buildClrDropdown();
  renderStock();
  renderHist();
  renderAlerts();
  renderOrders();
  var t = fT(new Date());
  document.getElementById('syncLine').textContent = 'Синхронизировано · '+t+' (авто)';
}

// ========== STATS ==========
function updateStats(){
  var merged = getMerged();
  var crit = merged.filter(function(x){ return x.min_qty>0 && x.qty<=x.min_qty; }).length;
  var zero = merged.filter(function(x){ return x.qty===0; }).length;
  document.getElementById('statTotal').textContent = merged.length;
  document.getElementById('statCrit').textContent  = crit;
  document.getElementById('statOps').textContent   = opCount||hist.length;
  document.getElementById('statZero').textContent  = zero;
  // badges
  var alertCount = crit;
  var pendOrders = orders.filter(function(o){ return o.status==='new'||o.status==='partial'; }).length;
  var ba = document.getElementById('badgeAlerts');
  ba.textContent = alertCount; ba.className = 'tab-badge'+(alertCount>0?' show':'');
  var bo = document.getElementById('badgeOrders');
  bo.textContent = pendOrders; bo.className = 'tab-badge orange'+(pendOrders>0?' show':'');
  var dot = document.getElementById('dotBell');
  if(alertCount>0||pendOrders>0) dot.classList.add('show'); else dot.classList.remove('show');
}

// ========== CAT CHIPS ==========
function buildCatChips(){
  var cats = ['Все'];
  parts.forEach(function(p){ if(p.category && cats.indexOf(p.category)<0) cats.push(p.category); });
  var html = '';
  cats.forEach(function(c){
    var active = (c==='Все' && !activeCat) || c===activeCat ? ' active' : '';
    html += '<div class="chip'+active+'" onclick="setCat(\''+c+'\')" touch-action="manipulation">'+c+'</div>';
  });
  document.getElementById('catChips').innerHTML = html;
}
function setCat(c){ activeCat = (c==='Все')?null:c; buildCatChips(); renderStock(); }

function buildOpsCatChips(){
  var cats = ['Все'];
  parts.forEach(function(p){ if(p.category && cats.indexOf(p.category)<0) cats.push(p.category); });
  var html = '';
  cats.forEach(function(c){
    var active = (c==='Все' && !opsCatFilter) || c===opsCatFilter ? ' active' : '';
    html += '<div class="chip'+active+'" onclick="setOpsCat(\''+c+'\')" touch-action="manipulation">'+c+'</div>';
  });
  document.getElementById('opsCatChips').innerHTML = html;
}
function setOpsCat(c){ opsCatFilter = (c==='Все')?null:c; buildOpsCatChips(); renderOps(); }

// ========== COLOR DROPDOWN ==========
function buildClrDropdown(){
  var html = '<div class="clr-item" onclick="setClr(null)"><div class="clr-dot" style="background:#888;border:1px solid rgba(255,255,255,.2);"></div><div class="clr-name">Все цвета</div>'+((!activeClr)?'<div class="clr-check">✓</div>':'')+'</div>';
  clrs.forEach(function(c){
    var check = (activeClr===c.name) ? '<div class="clr-check">✓</div>' : '';
    html += '<div class="clr-item" onclick="setClr(\''+escQ(c.name)+'\')">'
      +'<div class="clr-dot" style="background:'+c.hex+';"></div>'
      +'<div class="clr-name">'+c.name+'</div>'+check+'</div>';
  });
  document.getElementById('clrDropdown').innerHTML = html;
}
function toggleClrDrop(){
  var dd = document.getElementById('clrDropdown');
  dd.classList.toggle('open');
}
function setClr(name){
  activeClr = name;
  var dd = document.getElementById('clrDropdown');
  dd.classList.remove('open');
  var dot = document.getElementById('clrTrigDot');
  var nm  = document.getElementById('clrTrigName');
  if(name){ dot.style.background = cH(name); nm.textContent = name; }
  else { dot.style.background='#888'; nm.textContent='Все цвета'; }
  buildClrDropdown();
  renderStock();
}
function escQ(s){ return s.replace(/'/g,"&#39;"); }

// close dropdown on outside click
document.addEventListener('click', function(e){
  var dd = document.getElementById('clrDropdown');
  var tr = document.getElementById('clrTrigger');
  if(dd && !dd.contains(e.target) && !tr.contains(e.target)) dd.classList.remove('open');
});

// ========== STOCK RENDER ==========
function renderStock(){
  var merged = getMerged();
  var q = (document.getElementById('stockSearch').value||'').toLowerCase();
  var list = merged.filter(function(x){
    if(activeCat && x.category !== activeCat) return false;
    if(activeClr && x.color !== activeClr) return false;
    if(q && !(
      String(x.code).toLowerCase().includes(q) ||
      x.name.toLowerCase().includes(q) ||
      x.color.toLowerCase().includes(q) ||
      x.location.toLowerCase().includes(q)
    )) return false;
    return true;
  });
  var crit = list.filter(function(x){ return x.min_qty>0 && x.qty<=x.min_qty; });
  var ok   = list.filter(function(x){ return !(x.min_qty>0 && x.qty<=x.min_qty); });
  var html = '';
  if(crit.length){
    html += '<div class="sec-hdr danger">⚠ КРИТИЧНЫЙ ЗАПАС ('+crit.length+')</div>';
    crit.forEach(function(x){ html += itemCard(x, true); });
  }
  html += '<div class="sec-hdr ok">В наличии ('+ok.length+')</div>';
  if(ok.length) ok.forEach(function(x){ html += itemCard(x, false); });
  else html += '<div class="empty"><div class="empty-ico">📦</div>Нет позиций</div>';
  document.getElementById('stockList').innerHTML = html;
}
function itemCard(x, isCrit){
  var ico = catIco(x.category);
  var bg  = catColor(x.category);
  var dn  = sN(x.name);
  var qCls = isCrit ? ' danger' : '';
  return '<div class="item-card">'
    +'<div class="item-ico" style="background:'+bg+'22;color:'+bg+';" onclick="goToCell(\''+escQ(x.location)+'\',\''+escQ(x.code)+'\',\''+escQ(x.color)+'\')">'+ico+'</div>'
    +'<div class="item-body">'
    +'<div class="item-name" onclick="goToCell(\''+escQ(x.location)+'\',\''+escQ(x.code)+'\',\''+escQ(x.color)+'\')">'+dn+'</div>'
    +'<div class="item-meta"><div class="meta-dot" style="background:'+cH(x.color)+';"></div>'+x.color+' · '+x.code+(x.location?' · <span style="color:var(--accent)">'+x.location+'</span>':'')+'</div>'
    +'</div>'
    +'<div class="item-right">'
    +'<div class="item-qty'+qCls+'">'+x.qty+'</div>'
    +'<div class="item-unit">'+x.unit+'</div>'
    +'<div class="item-btns">'
    +'<div class="qty-btn plus" onclick="openOp(\'in\',\''+escQ(x.code)+'\',\''+escQ(x.name)+'\',\''+escQ(x.color)+'\')">+</div>'
    +'<div class="qty-btn minus" onclick="openOp(\'out\',\''+escQ(x.code)+'\',\''+escQ(x.name)+'\',\''+escQ(x.color)+'\')">−</div>'
    +'</div>'
    +'</div>'
    +'</div>';
}
function goToCell(loc, code, color){
  if(!loc) return;
  mapHL = {loc:loc, code:code, color:color};
  var mapBtn = document.getElementById('btnMap');
  switchTab('tabMap', mapBtn);
}

// ========== OPERATION MODAL ==========
function openOp(type, code, name, preColor){
  currentOpType = type;
  currentOpCode = code;
  currentOpName = name;
  var title = document.getElementById('opModalTitle');
  var sub   = document.getElementById('opModalSub');
  var nmEl  = document.getElementById('opModalName');
  var codeEl= document.getElementById('opModalCode');
  var conf  = document.getElementById('opConfirmBtn');
  title.textContent = type==='in' ? 'Приёмка товара' : 'Выдача товара';
  nmEl.childNodes[0] ? (nmEl.firstChild.nodeType===3 ? nmEl.firstChild.textContent=sN(name) : '') : '';
  nmEl.innerHTML = sN(name)+'<div class="modal-item-code" id="opModalCode">Артикул: '+code+'</div>';
  if(type==='out'){
    var cur = 0;
    stock.forEach(function(s){ if(String(s.code)===String(code)&&(!preColor||s.color===preColor)) cur+=Number(s.qty)||0; });
    sub.textContent = 'На складе: '+cur+' шт.';
  } else { sub.textContent = ''; }
  conf.textContent = type==='in' ? 'Принять' : 'Выдать';
  conf.className = 'btn '+(type==='in'?'btn-ok':'btn-danger');
  // colors
  var sel = document.getElementById('opColorSel');
  sel.innerHTML = '';
  clrs.forEach(function(c){
    var opt = document.createElement('option');
    opt.value = c.name; opt.textContent = c.name;
    if(c.name===preColor) opt.selected=true;
    sel.appendChild(opt);
  });
  if(!clrs.length){
    var colors = [];
    stock.forEach(function(s){ if(String(s.code)===String(code) && s.color && colors.indexOf(s.color)<0) colors.push(s.color); });
    colors.forEach(function(c){
      var opt = document.createElement('option');
      opt.value=c; opt.textContent=c; if(c===preColor) opt.selected=true;
      sel.appendChild(opt);
    });
  }
  document.getElementById('opQty').value = '1';
  document.getElementById('opDoc').value  = '';
  document.getElementById('opModal').classList.add('show');
}
async function confirmOp(){
  var type  = currentOpType;
  var code  = currentOpCode;
  var color = document.getElementById('opColorSel').value;
  var qty   = parseInt(document.getElementById('opQty').value)||0;
  var doc   = document.getElementById('opDoc').value;
  if(!qty||qty<=0){ toast('Укажите количество','err'); return; }
  var sItem = stock.find(function(s){ return String(s.code)===String(code)&&s.color===color; });
  var name  = currentOpName;
  var loc   = sItem ? sItem.location : '';
  var body  = {type:type==='in'?'in':'out', code:code, name:name, color:color, qty:qty, doc:doc, location:loc, user:'Кладовщик'};
  var btn   = document.getElementById('opConfirmBtn');
  btn.disabled = true; btn.textContent = '…';
  try{
    var res;
    if(SCRIPT_URL){ res = await api('addOperation', body); }
    else { res = {ok:true, newQty: (sItem?(Number(sItem.qty)||0)+(type==='in'?qty:-qty):qty)}; }
    if(res.ok){
      if(sItem){ sItem.qty = res.newQty; }
      else if(type==='in'){
        stock.push({code:code,name:name,color:color,qty:qty,location:loc});
      }
      var now = new Date();
      hist.unshift({date:fD(now),time:fT(now),type:type,code:code,name:name,color:color,qty:qty,doc:doc,location:loc});
      opCount++;
      saveL();
      rebuildAll();
      closeModal('opModal');
      toast((type==='in'?'+':'-')+qty+' '+(type==='in'?'принято ✓':'выдано ✓'),'ok');
    } else {
      toast(res.error||'Ошибка','err');
    }
  }catch(e){ toast('Ошибка сети','err'); }
  btn.disabled=false; btn.textContent=(type==='in'?'Принять':'Выдать');
}

// ========== MAP ==========
var rackOpen = {};
function renderMap(){
  if(!rack||!rack.length){ rack=defRack(); }
  var el = document.getElementById('mapContent');
  var html = '';
  rack.forEach(function(r){
    var cells = getCellsForRack(r.row);
    var occupied = Object.keys(cells).length;
    html += '<div class="rack-block">'
      +'<div class="rack-hdr" data-rack="'+r.row+'">'
      +'<div class="rack-badge">'+r.row+'</div>'
      +'<div class="rack-info"><div class="rack-desc">'+r.description+'</div>'
      +'<div class="rack-sub">'+r.sections+' секц · '+r.tiers+' яр · '+r.length+' · '+r.load+(occupied?' · '+occupied+' занято':'')+'</div></div>'
      +'<div class="rack-toggle">'+(rackOpen[r.row]?'▲':'▼')+'</div>'
      +'</div>'
      +'<div class="rack-body '+(rackOpen[r.row]?'open':'')+'" id="rack-'+r.row+'">'
      +renderRackBody(r, cells)
      +'</div></div>';
  });
  el.innerHTML = html;
  if(el._mapListener) el.removeEventListener('click', el._mapListener);
  el._mapListener = function(e){
    var cell = e.target.closest('[data-loc]');
    if(cell){ showCell(cell.dataset.loc); return; }
    var hdr = e.target.closest('[data-rack]');
    if(hdr){ toggleRack(hdr.dataset.rack); }
  };
  el.addEventListener('click', el._mapListener);
  if(mapHL) scrollToCell(mapHL.loc);
}
function getCellsForRack(row){
  var result = {};
  stock.forEach(function(s){
    if(!s.location) return;
    var loc = s.location;
    if(loc.charAt(0)!==row) return;
    var merged = getMerged();
    var item = merged.find(function(x){ return String(x.code)===String(s.code)&&x.color===s.color; });
    var isCrit = item && item.min_qty>0 && item.qty<=item.min_qty;
    if(!result[loc]||isCrit) result[loc]={qty:s.qty, name:s.name||'', code:s.code, color:s.color, isCrit:isCrit};
  });
  return result;
}
function renderRackBody(r, cells){
  var html = '';
  // section labels
  html += '<div class="slbls">';
  for(var s=1;s<=r.sections;s++) html += '<div class="slb">С'+s+'</div>';
  html += '</div>';
  // tiers from max down to 0
  for(var tier=r.tiers;tier>=0;tier--){
    html += '<div class="trow"><div class="tlbl" style="font-size:8px;color:var(--muted);">'+(tier===0?'Пол':'Я'+tier)+'</div><div class="cscroll">';
    for(var sec=1;sec<=r.sections;sec++){
      var loc = r.row+'-С'+sec+'-Я'+tier;
      var cell = cells[loc];
      var cls = 'cell';
      if(cell){
        if(mapHL && mapHL.loc===loc) cls+=' found';
        else if(cell.isCrit) cls+=' crit';
        else cls+=' occ';
      } else {
        if(tier<=1) cls+=' ground';
      }
      var lx = cell ? String(cell.qty).substring(0,3) : '';
      html += '<div class="'+cls+'" data-loc="'+loc+'">'+lx+'</div>';
    }
    html += '</div></div>';
  }
  html += '<div class="map-legend">'
    +'<div class="legend-item"><div class="legend-box occ"></div>Занято</div>'
    +'<div class="legend-item"><div class="legend-box crit"></div>Критично</div>'
    +'<div class="legend-item"><div class="legend-box found"></div>Найдено</div>'
    +'<div class="legend-item"><div class="legend-box ground"></div>Я0–Я1 оперативное</div>'
    +'</div>';
  return html;
}
function toggleRack(row){
  rackOpen[row] = !rackOpen[row];
  var body = document.getElementById('rack-'+row);
  if(body) body.classList.toggle('open', rackOpen[row]);
  var el = document.getElementById('mapContent');
  el.querySelectorAll('[data-rack="'+row+'"] .rack-toggle').forEach(function(t){ t.textContent = rackOpen[row]?'▲':'▼'; });
}
function updateMapCells(){
  rack.forEach(function(r){
    var cells = getCellsForRack(r.row);
    var body = document.getElementById('rack-'+r.row);
    if(!body||!body.classList.contains('open')) return;
    body.querySelectorAll('.cell[data-loc]').forEach(function(cellEl){
      var loc = cellEl.dataset.loc;
      var cell = cells[loc];
      cellEl.className = 'cell';
      if(cell){
        if(mapHL && mapHL.loc===loc) cellEl.className+=' found';
        else if(cell.isCrit) cellEl.className+=' crit';
        else cellEl.className+=' occ';
        cellEl.textContent = String(cell.qty).substring(0,3);
      } else {
        var parts = loc.split('-Я'); var tier=parseInt(parts[1])||0;
        if(tier<=1) cellEl.className+=' ground';
        cellEl.textContent='';
      }
    });
  });
}
function searchOnMap(){
  var q = (document.getElementById('mapSearch').value||'').toLowerCase();
  mapHL = null;
  if(q){
    var merged = getMerged();
    var found = merged.find(function(x){ return x.location && (x.name.toLowerCase().includes(q)||String(x.code).includes(q)||x.color.toLowerCase().includes(q)); });
    if(found) mapHL = {loc:found.location, code:found.code, color:found.color};
  }
  var activeTab = document.querySelector('.panel.active');
  if(activeTab && activeTab.id==='tabMap') renderMap();
  if(mapHL) { setTimeout(function(){ scrollToCell(mapHL.loc); }, 100); }
}
function scrollToCell(loc){
  if(!loc) return;
  var el = document.querySelector('[data-loc="'+loc+'"]');
  if(el){
    var row = loc.charAt(0);
    if(!rackOpen[row]){ rackOpen[row]=true; renderMap(); }
    setTimeout(function(){
      var el2 = document.querySelector('[data-loc="'+loc+'"]');
      if(el2) el2.scrollIntoView({behavior:'smooth',block:'center'});
    }, 50);
  } else {
    var row = loc.charAt(0);
    if(!rackOpen[row]){ rackOpen[row]=true; renderMap(); setTimeout(function(){ scrollToCell(loc); }, 100); }
  }
}
function showCell(loc){
  currentCellLoc = loc;
  var cells = {};
  rack.forEach(function(r){ var c = getCellsForRack(r.row); Object.assign(cells, c); });
  var cell = cells[loc];
  currentCellData = cell || null;
  var block = document.getElementById('cellInfoBlock');
  var merged = getMerged();
  var item = cell ? merged.find(function(x){ return String(x.code)===String(cell.code)&&x.color===cell.color; }) : null;
  var html = '<div class="cell-popup-title">'+(cell?(sN(cell.name)||'—'):'Пусто')+'</div>'
    +'<div class="cell-popup-addr">'+loc+'</div>';
  if(cell && item){
    html += '<div class="cell-grid">'
      +'<div class="cell-stat"><div class="cell-stat-lbl">Артикул</div><div class="cell-stat-val">'+cell.code+'</div></div>'
      +'<div class="cell-stat"><div class="cell-stat-lbl">Цвет</div><div class="cell-stat-val" style="font-size:12px;">'+cell.color+'</div></div>'
      +'<div class="cell-stat"><div class="cell-stat-lbl">Остаток</div><div class="cell-stat-val" style="color:'+(item.min_qty>0&&item.qty<=item.min_qty?'var(--danger)':'var(--ok)')+'">'+item.qty+'</div></div>'
      +'<div class="cell-stat"><div class="cell-stat-lbl">Мин.запас</div><div class="cell-stat-val">'+item.min_qty+'</div></div>'
      +'</div>';
  } else {
    html += '<div style="color:var(--muted);font-size:12px;margin-top:6px;">Ячейка пуста</div>';
  }
  block.innerHTML = html;
  document.getElementById('cellModalTitle').textContent = 'Ячейка '+loc;
  document.getElementById('cellModal').classList.add('show');
}
function openFromCell(type){
  if(!currentCellData){ toast('Ячейка пуста','err'); return; }
  closeModal('cellModal');
  openOp(type, currentCellData.code, currentCellData.name, currentCellData.color);
}
function openMoveModal(){
  if(!currentCellData){ toast('Ячейка пуста','err'); return; }
  closeModal('cellModal');
  document.getElementById('moveCurrentInfo').textContent = 'Текущая ячейка: '+currentCellLoc+' · '+sN(currentCellData.name)+' · '+currentCellData.color;
  document.getElementById('moveNewLoc').value = '';
  document.getElementById('moveModal').classList.add('show');
}
async function confirmMove(){
  var newLoc = document.getElementById('moveNewLoc').value.trim();
  if(!newLoc){ toast('Укажите ячейку','err'); return; }
  var body = {code:currentCellData.code, color:currentCellData.color, oldLocation:currentCellLoc, newLocation:newLoc};
  try{
    var res;
    if(SCRIPT_URL){ res = await api('updateCell', body); }
    else { res = {ok:true}; }
    if(res.ok){
      stock.forEach(function(s){ if(String(s.code)===String(body.code)&&s.color===body.color&&s.location===body.oldLocation) s.location=newLoc; });
      saveL(); rebuildAll();
      closeModal('moveModal');
      toast('Перемещено ✓','ok');
    } else { toast(res.error||'Ошибка','err'); }
  }catch(e){ toast('Ошибка сети','err'); }
}

// ========== ORDERS ==========
function renderOrders(){
  var pending = orders.filter(function(o){ return o.status==='new'||o.status==='partial'; });
  var done    = orders.filter(function(o){ return o.status==='done'; });
  var html = '';
  if(pending.length){
    html += '<div class="sec-hdr" style="color:var(--warn);margin-bottom:6px;">Ожидают выдачи ('+pending.length+')</div>';
    pending.forEach(function(o){ html += orderCard(o); });
  }
  if(done.length){
    html += '<div class="sec-hdr ok" style="margin-top:10px;margin-bottom:6px;">Выданные ('+done.length+')</div>';
    done.forEach(function(o){ html += orderCard(o); });
  }
  if(!orders.length) html = '<div class="empty"><div class="empty-ico">📋</div>Заказов нет</div>';
  document.getElementById('ordersList').innerHTML = html;
}
function orderCard(o){
  var positions = [];
  try{ positions = typeof o.positions==='string' ? JSON.parse(o.positions) : (o.positions||[]); }catch(e){}
  var statusLabel = {new:'Ожидает',partial:'Частично',done:'Выдан'}[o.status]||o.status;
  var statusCls   = {new:'status-new',partial:'status-partial',done:'status-done'}[o.status]||'status-new';
  var isOpen = false; // will be toggled via DOM
  var posHtml = '';
  positions.forEach(function(p,i){
    var merged = getMerged();
    var item = merged.find(function(x){ return String(x.code)===String(p.code)&&(!p.color||x.color===p.color); });
    var stock_qty = item ? item.qty : 0;
    var qColor = stock_qty>=p.qty ? 'var(--ok)' : 'var(--danger)';
    posHtml += '<div class="order-item">'
      +'<div class="order-cb" onclick="toggleCb(this)"></div>'
      +'<div class="order-item-body">'
      +'<div class="order-item-name">'+sN(p.name||'')+'</div>'
      +'<div class="order-item-meta">'
      +(p.color?'<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+cH(p.color)+';margin-right:3px;vertical-align:middle;"></span>'+p.color+' · ':'')
      +(p.location?'<span class="loc-tag">'+p.location+'</span> · ':'')
      +'<span style="color:'+qColor+'">'+stock_qty+' шт.</span>'
      +'</div></div>'
      +'<div class="order-qty">×'+p.qty+'</div>'
      +'</div>';
  });
  return '<div class="order-card">'
    +'<div class="order-hdr" onclick="toggleOrder(this)">'
    +'<div class="order-title">Заказ №'+o.number+' · '+o.master+'</div>'
    +'<div class="order-sub">'+(o.comment||'')+(o.time?' · '+o.time:'')+(o.date?' · '+o.date:'')+'</div>'
    +'<div class="order-badges"><span class="status-badge '+statusCls+'">'+statusLabel+'</span></div>'
    +'</div>'
    +'<div class="order-body" id="order-'+o.id+'">'
    +posHtml
    +'<div class="order-btns">'
    +(o.status!=='done'?'<button class="btn btn-danger" onclick="openDispatch(\''+o.id+'\')">Выдать по заказу</button>':'')
    +'<button class="btn btn-accent btn-sm" onclick="exportOrder(\''+o.id+'\')">📄 В таблицу</button>'
    +'</div></div>'
    +'</div>';
}
function toggleOrder(hdrEl){
  var body = hdrEl.nextElementSibling;
  if(body) body.classList.toggle('open');
}
function toggleCb(el){ el.classList.toggle('checked'); if(el.classList.contains('checked')) el.innerHTML='✓'; else el.innerHTML=''; }

function openNewOrder(){
  newOrderPositions = [];
  document.getElementById('newOrderMaster').value='';
  document.getElementById('newOrderComment').value='';
  renderNewOrderPositions();
  document.getElementById('newOrderModal').classList.add('show');
}
function renderNewOrderPositions(){

    var clrsOpts = '<option value="">— Цвет —</option>';

function addOrderPos(){ newOrderPositions.push({code:'',name:'',color:'',qty:1,location:''}); renderNewOrderPositions(); }
function removeOrderPos(i){ newOrderPositions.splice(i,1); renderNewOrderPositions(); }
function setOrderPosCode(i,v){ newOrderPositions[i].code=v; var p=parts.find(function(x){ return String(x.code)===String(v); }); if(p) newOrderPositions[i].name=p.name||''; }
function setOrderPosColor(i,v){ newOrderPositions[i].color=v; }
function setOrderPosQty(i,v){ newOrderPositions[i].qty=parseInt(v)||1; }
function setOrderPosLoc(i,v){ newOrderPositions[i].location=v; }
async function submitNewOrder(){
  var master = document.getElementById('newOrderMaster').value.trim();
  if(!master){ toast('Введите имя мастера','err'); return; }
  if(!newOrderPositions.length){ toast('Добавьте хотя бы одну позицию','err'); return; }
  var now = new Date();
  var id = Date.now();
  var num = orders.length + 1;
  var order = {id:String(id), number:num, master:master, comment:document.getElementById('newOrderComment').value, status:'new', date:fD(now), time:fT(now), positions:JSON.stringify(newOrderPositions)};
  try{
    if(SCRIPT_URL){
      var res = await api('addOrder', order);
      if(!res.ok){ toast(res.error||'Ошибка','err'); return; }
      if(res.id) order.id = res.id;
    }
    orders.unshift(order);
    saveL();
    renderOrders();
    updateStats();
    closeModal('newOrderModal');
    toast('Заказ создан ✓','ok');
  }catch(e){ toast('Ошибка','err'); }
}
function openDispatch(orderId){
  currentDispatchOrderId = orderId;
  var order = orders.find(function(o){ return String(o.id)===String(orderId); });
  if(!order) return;
  var positions = [];
  try{ positions = typeof order.positions==='string'?JSON.parse(order.positions):(order.positions||[]); }catch(e){}
  document.getElementById('dispatchTitle').textContent = 'Выдача по заказу №'+order.number;
  var html = '';
  var merged = getMerged();
  positions.forEach(function(p){
    var item = merged.find(function(x){ return String(x.code)===String(p.code)&&(!p.color||x.color===p.color); });
    var stock_qty = item?item.qty:0;
    var enough = stock_qty>=p.qty;
    html += '<div style="padding:8px;border-radius:8px;border:1px solid '+(enough?'var(--border)':'var(--danger)')+';margin-bottom:6px;">'
      +'<div style="font-size:13px;font-weight:600;">'+sN(p.name||p.code)+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:3px;">'
      +(p.color||'')+' · Нужно: '+p.qty+' · На складе: <span style="color:'+(enough?'var(--ok)':'var(--danger)')+'">'+stock_qty+'</span>'
      +(p.location?' · '+p.location:'')+'</div>'
      +'</div>';
  });
  document.getElementById('dispatchItems').innerHTML = html;
  document.getElementById('dispatchModal').classList.add('show');
}
async function confirmDispatch(){
  var order = orders.find(function(o){ return String(o.id)===String(currentDispatchOrderId); });
  if(!order) return;
  var positions = [];
  try{ positions = typeof order.positions==='string'?JSON.parse(order.positions):(order.positions||[]); }catch(e){}
  var now = new Date();
  var failed = false;
  for(var i=0;i<positions.length;i++){
    var p = positions[i];
    var sItem = stock.find(function(s){ return String(s.code)===String(p.code)&&(!p.color||s.color===p.color); });
    var body = {type:'out',code:p.code,name:p.name||'',color:p.color||'',qty:p.qty,doc:'Заказ №'+order.number,location:p.location||'',user:'Кладовщик'};
    try{
      var res;
      if(SCRIPT_URL){ res = await api('addOperation', body); }
      else { res = {ok:true, newQty:sItem?(Number(sItem.qty)||0)-p.qty:0}; }
      if(res.ok){
        if(sItem) sItem.qty = res.newQty;
        hist.unshift({date:fD(now),time:fT(now),type:'out',code:p.code,name:p.name||'',color:p.color||'',qty:p.qty,doc:'Заказ №'+order.number,location:p.location||''});
        opCount++;
      } else { failed=true; toast(res.error||'Ошибка: '+p.code,'err'); }
    }catch(e){ failed=true; }
  }
  order.status = failed?'partial':'done';
  if(SCRIPT_URL) try{ await api('updateOrder',{id:order.id,status:order.status}); }catch(e){}
  saveL(); rebuildAll();
  closeModal('dispatchModal');
  toast(failed?'Частично выдано':'Заказ выдан ✓', failed?'err':'ok');
}
async function exportOrder(orderId){
  if(!SCRIPT_URL){ toast('Настройте URL скрипта','err'); return; }
  var order = orders.find(function(o){ return String(o.id)===String(orderId); });
  if(!order) return;
  try{
    var res = await api('exportOrder', order);
    if(res.ok) toast('Экспортировано ✓','ok');
    else toast(res.error||'Ошибка','err');
  }catch(e){ toast('Ошибка сети','err'); }
}

// ========== SETTINGS ==========
function openSettings(){
  document.getElementById('scriptUrlInput').value = SCRIPT_URL||'';
  document.getElementById('connResult').textContent='';
  document.getElementById('settingsModal').classList.add('show');
}
function saveSettings(){
  var url = document.getElementById('scriptUrlInput').value.trim();
  SCRIPT_URL = url;
  localStorage.setItem('scriptUrl', url);
  toast('Сохранено ✓','ok');
}
async function checkConnection(){
  var url = document.getElementById('scriptUrlInput').value.trim();
  var res = document.getElementById('connResult');
  if(!url){ res.textContent='Введите URL'; res.className='conn-result err'; return; }
  res.textContent='Проверяю…'; res.className='conn-result';
  try{
    var old = SCRIPT_URL; SCRIPT_URL = url;
    var d = await api('getColors');
    SCRIPT_URL = old;
    if(d.ok||Array.isArray(d)||d.colors){ res.textContent='✓ Соединение установлено'; res.className='conn-result ok'; }
    else { res.textContent='✗ Ответ не OK: '+JSON.stringify(d).substring(0,80); res.className='conn-result err'; }
  }catch(e){ SCRIPT_URL=localStorage.getItem('scriptUrl')||''; res.textContent='✗ Ошибка: '+e.message; res.className='conn-result err'; }
}

// ========== INIT ==========
loadL();
rebuildAll();
syncAll();
setInterval(silentSync, 30000);
</script>
